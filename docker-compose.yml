version: '3.8'

services:
  # ── FastAPI Backend ────────────────────────────────────────────────────
  api:
    build: .
    container_name: fincon_rag_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000

  # ── Streamlit UI Frontend ──────────────────────────────────────────────
  ui:
    build: .
    container_name: fincon_rag_ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api

